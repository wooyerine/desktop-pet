<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Desktop Pet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="bubble" class="hidden">
      <span id="bubble-label"></span>
      <span id="bubble-time">00:00</span>
    </div>
    <div id="nag" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <div id="brag" class="hidden">
      <span id="brag-text"></span>
      <span id="brag-grass"></span>
    </div>

    <canvas id="pet-canvas" width="352" height="192"></canvas>

    <div id="bar">
      <button id="btn-work" title="일 시작">&#128188;</button>
      <button id="btn-away" title="자리 비움" class="hidden">&#9749;</button>
      <button id="btn-timer" title="뽀모도로 타이머">&#9200;</button>
      <button id="btn-rank" title="랭킹">&#127942;</button>
      <button id="btn-pet" title="펫 교체">&#128062;</button>
      <button id="btn-grass" title="잔디밭">&#127793;</button>
      <button id="btn-quit" title="종료">&#10005;</button>
    </div>

    <div id="hud">
      <span id="hud-level">Lv.1</span>
      <div id="xpbar"><div id="xpfill"></div></div>
      <span id="hud-xp">0/1000</span>
    </div>

    <div id="panel" class="hidden">
      <div class="panel-row">
        <button class="preset" data-min="25" data-label="집중">집중 25분</button>
        <button class="preset" data-min="5" data-label="휴식">휴식 5분</button>
      </div>
      <div class="panel-row">
        <input id="custom-min" type="number" min="1" max="180" placeholder="분" />
        <button id="btn-custom">시작</button>
      </div>
      <div class="panel-row">
        <button id="btn-pause">일시정지</button>
        <button id="btn-reset">리셋</button>
      </div>
      <div id="hint" class="hidden">
        &#9888; 키보드 감지를 하려면<br/>시스템 설정 &gt; 개인정보 보호 및 보안 &gt;<br/>손쉬운 사용에서 이 앱(Electron)을<br/>허용한 뒤 재시작해 주세요.
      </div>
    </div>

    <div id="grass-panel" class="hidden">
      <div class="grass-head">
        <span id="grass-sum">이번 주 0일</span>
        <span id="grass-streak"></span>
      </div>
      <div id="grass-grid"></div>
      <div class="grass-legend">
        <span>적음</span>
        <i class="g g0"></i><i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="g g4"></i>
        <span>많음</span>
        <span id="grass-today">오늘 0개</span>
      </div>
    </div>

    <div id="rank-panel" class="hidden">
      <div class="panel-row">
        <input id="nickname" type="text" maxlength="12" placeholder="닉네임" />
        <button id="btn-nick">저장</button>
      </div>
      <div id="rank-note" class="hidden">
        &#9888; 이 닉네임은 이미 등록돼 있어요.<br/>다른 닉네임으로 저장하거나,<br/>쓰던 동기화 코드로 이어하기 해주세요.
      </div>
      <div id="code-row" class="panel-row hidden">
        <span class="code-label">내 코드</span>
        <span id="code-text">••••-••••</span>
        <button id="btn-code-show">보기</button>
        <button id="btn-code-copy">복사</button>
      </div>
      <ol id="rank-list"></ol>
      <div class="panel-row">
        <button id="btn-rank-refresh">새로고침</button>
        <button id="btn-link-toggle">다른 PC에서 이어하기</button>
      </div>
      <div id="link-box" class="hidden">
        <div class="panel-row">
          <input id="link-nick" type="text" maxlength="12" placeholder="닉네임" />
        </div>
        <div class="panel-row">
          <input id="link-code" type="text" maxlength="9" placeholder="동기화 코드" />
          <button id="btn-link">불러오기</button>
        </div>
      </div>
    </div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
